<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lívia Lançoni">
    <meta name="description" content="Site da empresa DevConnect">

    <title>Tela Perfil - DevConnect</title>

    <link rel="shortcut icon" href="../images/DevConnect 3.svg" type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/perfil.css">

</head>

<body>
    <h1>Tela de Perfil - DevConnect</h1>
    <header id="cabecalho">
        <nav>
            <a id="logo-desktop" href="./feed.html">
                <img src="../images/DevConnect 2.svg" alt="Logo da empresa DevConnect">
            </a>
            <a id="logo-mobile" href="./feed.html">
                <img src="../images/DevConnect 3.svg" alt="Logo da empresa DevConnect">
            </a>

            <div class="cabecalho-acoes">
                <a href="./feed.html">
                    <img src="../images/botao casinha verde.svg" alt="Icone de uma casa na cor verde">
                </a>

                <a href="#">
                    <img src="../images/botao coracao verde.svg" alt="Icone de um coracao na cor verde">
                </a>

                <a href="./perfil.html">
                    <img class="foto-perfil" src="../images/1744867899-virginia-instagram.webp" alt="Foto de perfil">
                </a>

            </div>

        </nav>
    </header>

    <main>
        <div class="perfil-container">

            <section id="dados-perfil">
                <img class="perfil-foto-principal" src="../images/1744867899-virginia-instagram.webp" alt="">

                <div class="card-perfil">

                    <span class="nome-perfil">floflobiuta</span>
                    <button class="publicacoes" type="button">167 publicações</button>
                    <button class="seguindo">11 seguindo</button>
                    <button class="seguidores">3,2M seguidores</button>
                    <p class="nome">Maria Flor Fonseca</p>
                    <a href="" class="editar">Editar perfil</a>
                    <a href="" class="sair">Sair</a>



                </div>
            </section>

            <hr class="divisao">

            <section id="icone-publi">
                <img src="../images/icone-publicacoes.svg" alt="">
                <p>Publicações</p>
            </section>

            <section id="publicacoes-perfil">
                <article class="card-publicacao">
                    <header>
                        <a href="#">
                            <img class="foto-perfil" src="../images/1744867899-virginia-instagram.webp" alt="">

                            floflobiuta

                        </a>
                    </header>

                    <figure>
                        <figcaption class="descricao-publicacao">
                            <p class="texto-publi">Hoje fui para Dubai com minha família, nos divertimos muito. Brinquei bastante com meus
                                irmãos!
                                Foi muito divertido! Ganhei novos brinquedos, e conheci diversos lugares novos, fiquei
                                muito feliz.</p>

                        </figcaption>

                        <div class="interacoes-publicacao">
                            <button>
                                <img src="../images/botao coracao verde.svg" alt="">
                            </button>

                            <button>
                                <img src="../images/botao-comentario-verde.svg" alt="">
                            </button>

                            <span>
                                217mil curtidas
                            </span>

                        </div>

                    </figure>
                
                    <button type="button">Ver todos os comentários...</button>

                </article>

                 </section>

                 <section>
                <article class="card-publicacao2">
                    <header>
                        <a href="#">
                            <img class="foto-perfil" src="../images/1744867899-virginia-instagram.webp" alt="">

                            floflobiuta

                        </a>
                    </header>

                    <figure>
                        <figcaption class="descricao-publicacao">
                            <p class="texto-publi">Hoje fui para Dubai com minha família, nos divertimos muito. Brinquei bastante com meus
                                irmãos!
                                Foi muito divertido! Ganhei novos brinquedos, e conheci diversos lugares novos, fiquei
                                muito feliz.</p>

                        </figcaption>

                        <div class="interacoes-publicacao">
                            <button>
                                <img src="../images/botao coracao verde.svg" alt="">
                            </button>

                            <button>
                                <img src="../images/botao-comentario-verde.svg" alt="">
                            </button>

                            <span>
                                217mil curtidas
                            </span>

                        </div>

                    </figure>
                
                    <button type="button">Ver todos os comentários...</button>

                </article>
            </section>

        </div>

    </main>

</body>

</html>
