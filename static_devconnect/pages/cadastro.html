<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lívia Lançoni">
    <meta name="description" content="Site da empresa DevConnect">

    <title>Tela Cadastro - DevConnect</title>

    <link rel="shortcut icon" href="../images/DevConnect 3.svg" type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/cadastro.css">

</head>

<body>
    <h1>Tela principal cadastro</h1>
    <main>
        <div>
            <form id="formulario" class="estilo-formulario">
                <img src="../images/DevConnect.svg" alt="">
                <p>Cadastre-se para comunidade exclusiva de desenvolvedores(as).</p>
                <div>
                    <label for="">Nome e sobrenome:</label>
                    <input type="text" name="" id="">
                </div>

                <div>
                    <label for="">Nome de usuário:</label>
                    <input type="text" name="" id="">
                </div>

                <div>
                    <label for="">E-mail:</label>
                    <input type="email" name="" id="">
                </div>

                <div>
                    <label for="">Senha:</label>
                    <input type="password" name="" id="">
                </div>

                <div style="text-align: center;">
                    <label id="texto-upload" for="campo-upload">Faça upload da sua imagem aqui...</label>
                    <input type="file" id="campo-upload" >
                </div>

                <button type="submit" class="formulario-botao-rosa">Cadastrar-se</button>

                <p class="concordar-termos">Ao se cadastrar, você concorda com nossos Termos, Política de Dados e
                    Política de Cookies.</p>

            </form>

            <section id="secao-login" class="estilo-formulario">
                <p>Tem uma conta? <a href="../pages/index.html">Conecte-se</a></p>
            </section>
        </div>
    </main>

</body>

</html>
